color: - ტექსტის ფერს განსაზღვრავს.
<p style="color: blue;">ლურჯი ტექსტი</p>
background-color: - ელემენტის ფონს აძლევს ფერს.
<div style="background-color: yellow;">ფონიანი ტექსტი</div>
font-size: - ტექსტის ზომას განსაზღვრავს.
<p style="font-size: 20px;">დიდი ტექსტი</p>
text-align: - ტექსტის განლაგებას აკონტროლებს.
<p style="text-align: center;">ცენტრში</p>
-->
