<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>style style</title>
</head>
<body style="background-color: darkkhaki;">
    <h1>style</h1>

        <p style="color: rgb(79, 6, 148); background-color: aqua; font-size: xx-large; text-align: right;">burububu</p>


        <p style="color: rgb(94, 85, 166); background-color: rgb(255, 0, 204); font-size: larger; text-align:left;">burububu</p>


        <p style="color: chocolate; background-color: aquamarine; font-size: small; text-align: center;">burububu</p>


        <p style="color: bisque; background-color: brown; font-size: medium; text-align: right;">burububu</p>


        <p style="color: chartreuse;background-color:cornflowerblue; text-align: left; font-size: smaller;">burububu</p>


</body>
</html>
