<!-- video – გამოიყენება ვიდეოს გამოსატანად საიტზე 
audio – გამოიყენება აუდიოფაილების დასამატებად საიტზე 
source – გამოიყენება აუდიო/ვიდეო ფაილების ალტერნატიული წყაროების მისამატებლად
type – ეუბნება ბრაუზერს თუ რა ფორმატის ფაილია 
ვიდეოს შემოსატანად ვქმნით ერთ ცალ მშობელ video თეგს, მასში ვაშენებთ source თეგს, რომელსაც გადაეცემა src და type ატრიბუტი შესაბამისი მნიშვნელობებით.
video თეგში type ატრიბუტის შესაძლო მნიშვნელობები: video/mp4 | video/ogg | video/webm
autoplay ატრიბუტის მეშვეობით მივუთითებთ ვიდეოს რომ ავტომატურად ჩაიტვირთოს ვებ-საიტის გაშვებისას.
muted ატრიბუტის მეშვეობთ მივუთითებთ ვიდეოს რომ ხმა ჰქონდეს დახშობილი.
loop ატრიბუტის მეშვეობით მივუთითებთ ვიდეოს რომ მუდმივად გაეშვას ყოველი დასრულების შემდეგ.
audio თეგში type ატრიბუტის შესაძლო მნიშნელობები: audio/mp3 | audio/mpeg | audio/ogg
-->
