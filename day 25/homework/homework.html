<!--
INLINE ელემენტები - იკავებენ მხოლოდ იმ ადგილს, რაც მათ შიგნით არსებულ კონტენტს სჭირდება არ იწყებენ ახალ ხაზს
მაგალითები: span, a, img, strong, em
BLOCK-LEVEL ელემენტები - იკავებენ მთელ ხაზს (სიგანეს)ყოველთვის იწყებენ ახალ ხაზზე
მაგალითები: div, p, h1-h6, section, article
div არის block-level კონტეინერი
იგი გამოიყენება:ელემენტების დაჯგუფებისთვის განლაგებისთვის დიზაინის მისანიჭებლად
border ავლებს საზღვარს იმის გარშემო რასაც გავუწერთ
borderს აქვს სხვადასხვანაირი სტილები, ესენია:
solid-ჩვეულებრივი ხაზი 
dashed-წყვეტილი ხაზები
dotted-წერტილებით გარშემორტყმული
double-ორი ხაზი ერთად
-->
